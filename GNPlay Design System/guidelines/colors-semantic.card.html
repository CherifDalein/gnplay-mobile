<!-- @dsCard group="Colors" viewport="700x150" subtitle="Success / warning / danger / info" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:#0B0B0D;padding:20px;display:flex;gap:10px;font-family:Inter,sans-serif">
  <div style="flex:1;background:var(--success-bg);border-radius:10px;padding:14px;text-align:center"><div style="width:8px;height:8px;border-radius:50%;background:var(--success);margin:0 auto 8px"></div><div style="color:var(--success);font-size:11px;font-weight:600">Publié</div></div><div style="flex:1;background:var(--warning-bg);border-radius:10px;padding:14px;text-align:center"><div style="width:8px;height:8px;border-radius:50%;background:var(--warning);margin:0 auto 8px"></div><div style="color:var(--warning);font-size:11px;font-weight:600">En attente</div></div><div style="flex:1;background:var(--danger-bg);border-radius:10px;padding:14px;text-align:center"><div style="width:8px;height:8px;border-radius:50%;background:var(--danger);margin:0 auto 8px"></div><div style="color:var(--danger);font-size:11px;font-weight:600">Échec</div></div><div style="flex:1;background:var(--info-bg);border-radius:10px;padding:14px;text-align:center"><div style="width:8px;height:8px;border-radius:50%;background:var(--info);margin:0 auto 8px"></div><div style="color:var(--info);font-size:11px;font-weight:600">Info</div></div>
</div>
